<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polynomial & Absolute Value Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Polynomial & Absolute Value Quiz Questions</h1>
    <p>Three levels: Basic, Application, Analysis. Auto-correction included (MCQ / numeric / keyword-based text).</p>
    <div id="quiz"></div>
    <div class="controls">
      <button id="checkBtn">Check Answers</button>
      <button id="resetBtn">Reset</button>
      <button id="exportBtn">Export CSV</button>
    </div>
    <p class="note">Notes: Numeric answers require simplified form (e.g. x² - x - 6 or 2, -5). Text answers are auto-graded by keyword matching.</p>
    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
